name: "Python CI"

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to run the CI checks on
        required: true
        type: string
      sqlalchemy-version:
        description: SQLAlchemy version to run the CI checks on
        required: true
        type: string

defaults:
  run:
    working-directory: ./

jobs:
  pylint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "[cicd]"

      - name: Run pylint
        run: |
          pylint --rcfile pyproject.toml src/ensembl
          pylint --rcfile pyproject.toml tests

  mypy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "[cicd]"

      - name: Run mypy
        run: |
          mypy --config-file pyproject.toml src/ensembl
          mypy --config-file pyproject.toml tests

  black:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          tags: "[cicd]"

      - name: Run black
        run: |
          black --config pyproject.toml --check .

  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/python_build
        with:
          python-version: ${{ inputs.python-version }}
          sqlalchemy-version: ${{ inputs.sqlalchemy-version }}
          tags: "[cicd]"

      - name: Run pytest with coverage
        run: |
          mkdir -p reports
          set -o pipefail
          coverage run -m pytest 2>&1 | tee ./reports/pytest_output.txt
          coverage report -m | tee ./reports/coverage_report.txt

      - name: Write summary
        run: |
          echo "## Test & Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat ./reports/coverage_report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Post coverage comment on PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PYTEST_SUMMARY=$(grep -E "=+ .*(passed|failed|error).* =+" ./reports/pytest_output.txt \
            | tail -1 \
            | tr -d '=' \
            | xargs)
          COV_TOTAL=$(grep "^TOTAL" ./reports/coverage_report.txt | awk '{print $NF}')
          gh pr comment "$PR_NUMBER" --body "## Test & Coverage Report
          **${PYTEST_SUMMARY}** | Coverage: **${COV_TOTAL}**

          <details><summary>Coverage breakdown</summary>

          \`\`\`
          $(cat ./reports/coverage_report.txt)
          \`\`\`
          </details>"
